name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Fully self-contained: installs nothing, needs no browser. A property
      # worth preserving: a contributor can clone and run it.
      - name: Librarian regression tests
        run: npm test

      # Both extensions load unpacked from what is committed here, so the
      # thing most worth checking is that a fresh checkout is complete:
      # every manifest entry point, service-worker importScripts target and
      # page asset resolves to a file. Loading them in a real Chrome would
      # check more; this catches the failure that actually happened, which
      # was a build output the commit never contained.
      - name: Both extensions load from a fresh checkout
        run: npm run check:loadable

  # This repository rebuilds its own bundles from the vendored @ai4a11y
  # packages (vendor/, pinned by vendor/PIN.json). A stale committed bundle
  # or generated lib/ file fails here.
  build:
    name: Bundles are fresh
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install both roots
        run: |
          npm ci
          cd personalized-extension && npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Rebuild everything
        run: npm run build

      - name: Committed outputs match the rebuild
        run: git diff --exit-code

      - name: Verifier tests
        run: node personalized-extension/test/verifier-test.mjs

  # The vendored tarballs must be exactly what `npm pack` produces at the
  # commit vendor/PIN.json records. Compares extracted trees, not tarball
  # bytes, so gzip and npm-version differences cannot cause false failures.
  vendor:
    name: Vendored tarballs match the pin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Re-pack from the pinned commit and diff
        run: |
          REPO=$(node -p "require('./vendor/PIN.json').repo")
          COMMIT=$(node -p "require('./vendor/PIN.json').commit")
          git clone --quiet --no-checkout "$REPO" /tmp/toolkit-src
          git -C /tmp/toolkit-src checkout --quiet "$COMMIT"
          mkdir -p /tmp/packed /tmp/fresh /tmp/committed
          (cd /tmp/toolkit-src/toolkit && npm pack --pack-destination /tmp/packed --silent)
          (cd /tmp/toolkit-src/tools && npm pack --pack-destination /tmp/packed --silent)
          for t in /tmp/packed/*.tgz; do mkdir -p "/tmp/fresh/$(basename "$t" .tgz)" && tar -xzf "$t" -C "/tmp/fresh/$(basename "$t" .tgz)"; done
          tar -xzf vendor/ai4a11y-toolkit.tgz -C /tmp/committed --one-top-level=toolkit
          tar -xzf vendor/ai4a11y-tools.tgz -C /tmp/committed --one-top-level=tools
          diff -r /tmp/fresh/*toolkit*/package /tmp/committed/toolkit/package
          diff -r /tmp/fresh/*tools*/package /tmp/committed/tools/package

  # Kept separate from `test` on purpose: this one needs Chrome and one
  # dependency, so a failure here points at the extensions rather than at
  # the toolchain.
  chrome:
    name: Both extensions load in Chrome
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install puppeteer-core
        run: npm ci

      # Chrome is preinstalled on the GitHub-hosted Ubuntu images. Fail with a
      # readable message rather than a stack trace if that ever changes.
      - name: Locate Chrome
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome on this runner. Install one, or pin an image that has it." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Load both extensions
        run: npm run check:chrome
