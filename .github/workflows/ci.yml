name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # What this repo can test today. The extension bundles and the
      # personalized extension's toolkit-derived lib/ files are committed and
      # currently rebuilt in the toolkit repository, where the code they are
      # built from is canonical; the remaining personalized-extension tests
      # (test/run-tests.js) also import that code and run there. See the
      # README's "Builds and tests" section.
      - name: Librarian regression tests
        run: npm test

      # Both extensions load unpacked from what is committed here, so the
      # thing most worth checking is that a fresh checkout is complete:
      # every manifest entry point, service-worker importScripts target and
      # page asset resolves to a file. Loading them in a real Chrome would
      # check more; this catches the failure that actually happened, which
      # was a build output the commit never contained.
      - name: Both extensions load from a fresh checkout
        run: npm run check:loadable

  # Kept separate from `test` on purpose. That job installs nothing and needs
  # no browser, which is a property worth preserving: a contributor can clone
  # and run it. This one needs Chrome and one dependency, so a failure here
  # points at the extensions rather than at the toolchain.
  chrome:
    name: Both extensions load in Chrome
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install puppeteer-core
        run: npm ci

      # Chrome is preinstalled on the GitHub-hosted Ubuntu images. Fail with a
      # readable message rather than a stack trace if that ever changes.
      - name: Locate Chrome
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome on this runner. Install one, or pin an image that has it." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Load both extensions
        run: npm run check:chrome
